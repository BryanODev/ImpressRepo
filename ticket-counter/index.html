<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ticket Counter Power-Up</title>
  <!-- Load Trello Power-Up client library from unpkg backup -->
  <script src="https://unpkg.com/@trello/power-up@latest/dist/power-up.min.js"></script>
</head>
<body>
  <script>
    window.TrelloPowerUp.initialize({
      'board-buttons': function(t, options) {
        return [{
          icon: 'https://cdn.jsdelivr.net/npm/@mdi/v7.2.96/svg/plus-box-outline.svg',
          text: 'Create Ticket',
          callback: async function(t) {
            try {
              // 1. Get the current counter from Trello board storage (defaults to 1)
              let currentCount = await t.get('board', 'shared', 'ticketCounter', 1);

              // 2. Format your card name template (e.g., #0001 - Task Name)
              let formattedId = String(currentCount).padStart(4, '0');
              let cardTitle = `#${formattedId} - New Task`;

              // 3. Find the first list on the board to put the card into
              let board = await t.board('id', 'lists');
              if (!board.lists || board.lists.length === 0) {
                return t.alert({ message: 'No lists found on this board!', duration: 'error' });
              }
              let targetListId = board.lists[0].id;

              // 4. Create the card using Trello's REST API wrapper
              await t.rest('POST', '/1/cards', {
                name: cardTitle,
                idList: targetListId,
                pos: 'top'
              });

              // 5. Increment the counter and save it back to Trello's board storage
              await t.set('board', 'shared', 'ticketCounter', currentCount + 1);

              // 6. Success notification
              t.alert({
                message: `Created ticket #${formattedId}!`,
                duration: 'success'
              });

            } catch (error) {
              console.error(error);
              t.alert({
                message: 'Failed to create ticket card.',
                duration: 'error'
              });
            }
          }
        }];
      }
    });
  </script>
</body>
</html>
