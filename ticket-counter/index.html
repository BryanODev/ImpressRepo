<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Ticket Counter Power-Up</title>
  <!-- Official Trello Power-Up Client Library -->
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>

<body>
  <script>
    TrelloPowerUp.initialize({
      "card-buttons": function (t, options) {
        return [
          {
            icon: "https://cdn.glitch.com/1b42d7fe-bda8-4af8-a6c8-eff0cea9e08a%2Frocket-ship.png?1494946700421",
            text: "Estimate Size",
            callback: function (t) {
              return t.popup({
                title: "Estimation",
                url: "estimate.html",
              });
            },
          },
        ];
      },
    });
  </script>
</body>

</html>
