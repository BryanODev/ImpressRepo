```html
<!DOCTYPE html>
<html>

<head>

  <meta charset="utf-8">

  <title>New Ticket Details</title>

  <script src="https://p.trellocdn.com/power-up.min.js"></script>


  <style>

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif !important;

      padding: 15px !important;

      color: #ffffff !important;

      background: #1d2125 !important;

      margin: 0 !important;
    }


    label {
      display: block !important;

      margin-top: 12px !important;

      font-weight: 600 !important;

      font-size: 12px !important;

      color: #9fadbc !important;
    }


    input,
    select {

      width: 100% !important;

      padding: 8px 10px !important;

      margin-top: 4px !important;

      box-sizing: border-box !important;

      border:
        1px solid
        #38414a !important;

      border-radius: 4px !important;

      background-color:
        #22272b !important;

      color: #ffffff !important;

      font-size: 14px !important;
    }


    input::placeholder {
      color: #738496 !important;
    }


    input:focus,
    select:focus {

      outline: none !important;

      border-color:
        #579dff !important;
    }


    select option {

      background-color:
        #22272b !important;

      color:
        #ffffff !important;
    }


    button {

      margin-top: 20px !important;

      background-color:
        #0079bf !important;

      color: white !important;

      border: none !important;

      padding:
        10px 15px !important;

      font-weight: bold !important;

      border-radius: 4px !important;

      cursor: pointer !important;

      width: 100% !important;

      font-size: 14px !important;
    }


    button:hover {

      background-color:
        #026aa7 !important;
    }


    button:disabled {

      opacity: 0.6 !important;

      cursor: not-allowed !important;
    }

  </style>

</head>


<body>


  <div id="ticketForm">


    <label>
      Card Title Identifier (e.g. Company Name) *
    </label>

    <input
      type="text"
      id="cardNameInput"
      required
      placeholder="Will format as #0000 - [Input Here]"
    >


    <label>
      Vendedor *
    </label>

    <select
      id="vendedor"
      required
    >

      <option value="Yoemi">
        Yoemi
      </option>

      <option value="Mairita">
        Mairita
      </option>

      <option value="There">
        There
      </option>

      <option value="Joshua">
        Joshua
      </option>

      <option value="Luis">
        Luis
      </option>

      <option value="Michi">
        Michi
      </option>

    </select>


    <label>
      Nombre Cliente (Full Name) *
    </label>

    <input
      type="text"
      id="nombreCliente"
      required
      placeholder="John Doe"
    >


    <label>
      Email
    </label>

    <input
      type="email"
      id="email"
      placeholder="john@example.com"
    >


    <label>
      Numero Telefono
    </label>

    <input
      type="tel"
      id="telefono"
      placeholder="555-0199"
    >


    <label>
      Prioridad *
    </label>

    <select
      id="prioridad"
      required
    >

      <option value="Normal">
        Normal
      </option>

      <option value="Rush">
        Rush
      </option>

      <option value="Super Rush">
        Super Rush
      </option>

    </select>


    <label>
      Metodo de Entrega
    </label>

    <select id="metodoEntrega">

      <option value="Pickup">
        Pickup
      </option>

      <option value="Delivery">
        Delivery
      </option>

      <option value="Shipping">
        Shipping
      </option>

      <option value="Instalación">
        Instalación
      </option>

    </select>


    <label>
      Arte
    </label>

    <select id="arte">

      <option value="N/A">
        N/A
      </option>

      <option value="En Espera">
        En Espera
      </option>

      <option value="Recibido">
        Recibido
      </option>

      <option value="En Systema">
        En Systema
      </option>

    </select>


    <button
      type="button"
      id="submitBtn"
    >
      Create Ticket
    </button>


  </div>


  <script>

    var t =
      window.TrelloPowerUp.iframe();


    var submitBtn =
      document.getElementById(
        'submitBtn'
      );


    // ==========================================================
    // SUBMIT
    // ==========================================================

    submitBtn.addEventListener(
      'click',
      async function() {


        console.log(
          'FORM CREATE TICKET BUTTON CLICKED'
        );


        // ------------------------------------------------------
        // Read required fields
        // ------------------------------------------------------

        var cardName =
          document
            .getElementById(
              'cardNameInput'
            )
            .value
            .trim();


        var clientName =
          document
            .getElementById(
              'nombreCliente'
            )
            .value
            .trim();


        // ------------------------------------------------------
        // Validate
        // ------------------------------------------------------

        if (!cardName || !clientName) {

          alert(
            'Please fill out the required Card Title and Client Name fields!'
          );

          return;
        }


        // ------------------------------------------------------
        // Prevent double-click
        // ------------------------------------------------------

        submitBtn.disabled = true;

        submitBtn.textContent =
          'Creating...';


        // ------------------------------------------------------
        // Build form data
        // ------------------------------------------------------

        var formData = {

          cardTitleInput:
            cardName,

          vendedor:
            document
              .getElementById(
                'vendedor'
              )
              .value,

          nombreCliente:
            clientName,

          email:
            document
              .getElementById(
                'email'
              )
              .value
              .trim(),

          telefono:
            document
              .getElementById(
                'telefono'
              )
              .value
              .trim(),

          prioridad:
            document
              .getElementById(
                'prioridad'
              )
              .value,

          metodoEntrega:
            document
              .getElementById(
                'metodoEntrega'
              )
              .value,

          arte:
            document
              .getElementById(
                'arte'
              )
              .value
        };


        console.log(
          'FORM DATA:',
          formData
        );


        try {


          // ----------------------------------------------------
          // THIS IS THE CRITICAL PART
          //
          // We explicitly mark the form as SUBMITTED.
          //
          // Closing the modal without this object will NOT
          // create a card.
          // ----------------------------------------------------

          await t.set(

            'member',

            'private',

            'pendingTicketSubmission',

            {
              submitted: true,

              formData: formData
            }

          );


          console.log(
            'SUBMISSION MARKER SAVED'
          );


          // ----------------------------------------------------
          // Tell parent:
          //
          // "The user actually clicked Create Ticket."
          // ----------------------------------------------------

          await t.notifyParent(
            'done'
          );


          // ----------------------------------------------------
          // Close the modal.
          //
          // The parent callback will now see submitted:true.
          // ----------------------------------------------------

          t.closeModal();


        } catch (error) {


          console.error(
            'Failed to submit ticket form:',
            error
          );


          submitBtn.disabled = false;

          submitBtn.textContent =
            'Create Ticket';


          alert(
            'Could not submit the ticket form. Please try again.'
          );

        }

      }
    );

  </script>


</body>

</html>
```
