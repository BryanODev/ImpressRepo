<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>New Ticket Details</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #1d2125;
    color: #ffffff;
  }

  form {
    width: 100%;
  }

  label {
    display: block;
    margin-top: 14px;
    margin-bottom: 6px;
    color: #b6c2cf;
    font-size: 12px;
    font-weight: 600;
  }

  label:first-child {
    margin-top: 0;
  }

  input,
  select {
    width: 100%;
    height: 40px;
    padding: 8px 10px;

    background: #22272b;
    color: #ffffff;

    border: 1px solid #738496;
    border-radius: 4px;

    font-family: inherit;
    font-size: 14px;

    outline: none;
    transition:
      border-color 0.15s ease,
      background-color 0.15s ease;
  }

  input:hover,
  select:hover {
    background: #282e33;
    border-color: #9fadbc;
  }

  input:focus,
  select:focus {
    background: #22272b;
    border-color: #579dff;
    box-shadow: 0 0 0 1px #579dff;
  }

  input::placeholder {
    color: #8c9bab;
  }

  select option {
    background: #22272b;
    color: #ffffff;
  }

  button {
    width: 100%;
    margin-top: 22px;
    padding: 10px 16px;

    background: #579dff;
    color: #1d2125;

    border: none;
    border-radius: 4px;

    font-family: inherit;
    font-size: 14px;
    font-weight: 600;

    cursor: pointer;

    transition: background-color 0.15s ease;
  }

  button:hover {
    background: #85b8ff;
  }

  button:active {
    background: #388bff;
  }
</style>
</head>
<body>
  <form id="ticketForm">
    <label>Vendedor *</label>
    <select id="vendedor" required>
      <option value="Yoemi">Yoemi</option>
      <option value="Mairita">Mairita</option>
      <option value="There">There</option>
      <option value="Joshua">Joshua</option>
      <option value="Luis">Luis</option>
      <option value="Michi">Michi</option>
    </select>

    <label>Cliente (Short Code/Name for Title) *</label>
    <input type="text" id="client" required placeholder="e.g. Acme Corp">

    <label>Nombre Cliente (Full Name) *</label>
    <input type="text" id="nombreCliente" required placeholder="John Doe">

    <label>Email</label>
    <input type="email" id="email" placeholder="john@example.com">

    <label>Numero Telefono</label>
    <input type="tel" id="telefono" placeholder="555-0199">

    <label>Prioridad *</label>
    <select id="prioridad" required>
      <option value="Normal">Normal</option>
      <option value="Rush">Rush</option>
      <option value="Super Rush">Super Rush</option>
    </select>

    <label>Metodo de Entrega</label>
    <select id="metodoEntrega">
      <option value="Pickup">Pickup</option>
      <option value="Delivery">Delivery</option>
      <option value="Shipping">Shipping</option>
      <option value="Instalación">Instalación</option>
    </select>

    <label>Arte</label>
    <select id="arte">
      <option value="N/A">N/A</option>
      <option value="En Espera">En Espera</option>
      <option value="Recibido">Recibido</option>
      <option value="En Systema">En Systema</option>
    </select>

    <button type="submit">Create Ticket</button>
  </form>

  <script>
    var t = window.TrelloPowerUp.iframe();

    document.getElementById('ticketForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      var formData = {
        vendedor: document.getElementById('vendedor').value,
        client: document.getElementById('client').value,
        nombreCliente: document.getElementById('nombreCliente').value,
        email: document.getElementById('email').value,
        telefono: document.getElementById('telefono').value,
        prioridad: document.getElementById('prioridad').value,
        metodoEntrega: document.getElementById('metodoEntrega').value,
        arte: document.getElementById('arte').value
      };

      t.closePopup(formData);
    });
  </script>
</body>
</html>
