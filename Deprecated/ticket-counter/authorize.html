<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Authorize Power-Up</title>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>

<body>
    <script>
        var API_KEY = 'eb1974fbb9e6a0def3d070da33e9cf05';

        // Pass appKey and appName inside the configuration object argument
        var t = window.TrelloPowerUp.iframe({
            appKey: API_KEY,
            appName: 'Impress New Task'
        });

        // Trigger Trello's built-in authorization flow window
        t.getRestApi().authorize({
            scope: 'read,write',
            expiration: 'never'
        })
            .then(function () {
                return t.closePopup();
            })
            .catch(function (error) {
                console.error('Authorization failed:', error);
            });
    </script>
</body>

</html>
