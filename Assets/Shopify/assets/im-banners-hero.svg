<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1200 750" fill="none">
 <defs>
  <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe57e"/><stop offset=".56" stop-color="#fbbf00"/><stop offset="1" stop-color="#e99900"/></linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#cfd5dc"/></linearGradient>
  <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#30343b"/><stop offset="1" stop-color="#0d1014"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#fbbf00" stop-opacity=".35"/><stop offset="1" stop-color="#fbbf00" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="20"/></filter>
  <filter id="glowshadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="12" dy="20" stdDeviation="14" flood-color="#000" flood-opacity=".65"/></filter>
