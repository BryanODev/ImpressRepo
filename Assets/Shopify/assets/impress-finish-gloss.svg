<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Gloss shiny sticker finish icon">
  <defs>
    <clipPath id="sticker-face"><path d="M40 22 H86 C98 22 104 30 104 42 V85 C104 92 101 97 96 101 L91 106 H40 C28 106 22 98 22 86 V42 C22 30 28 22 40 22 Z"/></clipPath>
    <linearGradient id="paper-fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffef4"/>
      <stop offset="0.55" stop-color="#f5eddf"/>
      <stop offset="1" stop-color="#d6cbbb"/>
    </linearGradient>
    <linearGradient id="gloss-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".26" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset=".50" stop-color="#ffffff" stop-opacity=".87"/>
      <stop offset=".75" stop-color="#ffffff" stop-opacity=".26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M40 16 H86 C101 16 110 27 110 42 V86 C110 93 108 98 102 104 L94 112 H40 C25 112 16 101 16 86 V42 C16 27 25 16 40 16 Z" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
  <path d="M40 22 H86 C98 22 104 30 104 42 V85 C104 92 101 97 96 101 L91 106 H40 C28 106 22 98 22 86 V42 C22 30 28 22 40 22 Z" fill="#fbbf00" stroke="#1d2c35" stroke-width="5.2" stroke-linejoin="round"/>
  <g clip-path="url(#sticker-face)">
    <!-- High-specular translucent diagonal band: this one means GLOSS. -->
    <path d="M-1 68 L72 -10 L109 6 L34 91 Z" fill="url(#gloss-sweep)" opacity=".82"/>
    <path d="M52 22 L91 22 L23 94 L22 63Z" fill="#ffffff" opacity=".15"/>
    <path d="M35 33 C53 25 74 24 88 34" fill="none" stroke="#ffffff" stroke-width="3" opacity=".65" stroke-linecap="round"/>
  </g>
  <!-- Glint intentionally sits on the yellow face and reads even at 40px. -->
  <path d="M83 31 Q85 44 98 46 Q85 48 83 61 Q81 48 68 46 Q81 44 83 31 Z" fill="#ffffff" opacity=".96"/>
  <circle cx="93" cy="28" r="2.5" fill="#ffffff" opacity=".84"/>
  <path d="M77 106 C77 91 84 84 99 84 H104 C101 94 94 101 84 106 Z" fill="url(#paper-fold)" stroke="#1d2c35" stroke-width="4.4" stroke-linejoin="round"/>
  <path d="M79 104 C87 100 97 91 103 85 C97 91 93 97 88 101 Z" fill="#cec4b6" opacity=".54"/>
</svg>
