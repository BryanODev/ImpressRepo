<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">

    <title>Items Preview</title>

    <style>
        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 10px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            font-size: 14px;

            background: #ffffff;

            color: #172b4d;

        }


        .header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 8px;

        }


        .progress {

            color: #5e6c84;

            font-size: 12px;

        }


        .items {

            display: flex;

            flex-direction: column;

            gap: 4px;

            max-height: 130px;

            overflow-y: auto;

        }


        .item {

            display: flex;

            align-items: center;

            gap: 8px;

            padding: 5px 6px;

            border-radius: 3px;

        }


        .item:hover {

            background: #f4f5f7;

        }


        .checkbox {

            width: 16px;

            height: 16px;

            flex-shrink: 0;

        }


        .description {

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

        }

        .preview-price {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-top: 10px;

            padding-top: 8px;

            border-top: 1px solid #dfe1e6;

            font-size: 14px;

        }


        .preview-price strong {

            font-size: 15px;

        }

        .finished {

            text-decoration: line-through;

            color: #6b778c;

        }


        .empty {

            padding: 12px;

            text-align: center;

            color: #6b778c;

        }


        .open-button {

            width: 100%;

            margin-top: 10px;

            padding: 8px 12px;

            border: none;

            border-radius: 3px;

            background: #0c66e4;

            color: white;

            font-size: 14px;

            font-weight: 500;

            cursor: pointer;

        }


        .open-button:hover {

            background: #0055cc;

        }
    </style>

</head>


<body>

    <div class="header">

        <strong>Items</strong>

        <span id="progress" class="progress">

            0 / 0 finished

        </span>

    </div>


    <div id="items" class="items">
    </div>


    <div class="preview-price">

        <span>Price</span>

        <strong id="price">
            $0.00
        </strong>

    </div>


    <button id="openTable" class="open-button">

        Open Task Table

    </button>


    <script src="https://p.trellocdn.com/power-up.min.js"></script>

    <script src="preview.js"></script>

</body>

</html>
