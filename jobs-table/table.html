<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">

    <title>Items</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 12px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 14px;
            background: #ffffff;
            color: #172b4d;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th {
            background: #f4f5f7;
            font-weight: 600;
            text-align: left;
            padding: 8px;
            border: 1px solid #dfe1e6;
        }

        td {
            padding: 4px;
            border: 1px solid #dfe1e6;
            vertical-align: middle;
        }

        th.check,
        td.check {
            width: 42px;
            text-align: center;
        }

        th.quantity,
        td.quantity {
            width: 90px;
        }

        th.cost,
        td.cost {
            width: 100px;
        }

        th.file,
        td.file {
            width: 160px;
        }

        input {
            width: 100%;
            border: none;
            outline: none;
            padding: 6px;
            background: transparent;
            color: inherit;
            font: inherit;
        }

        input:focus {
            background: #fff;
            box-shadow: inset 0 0 0 2px #0c66e4;
            border-radius: 3px;
        }

        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .delete-button {
            border: none;
            background: transparent;
            color: #6b778c;
            cursor: pointer;
            font-size: 16px;
        }

        .delete-button:hover {
            color: #de350b;
        }

        .add-row {
            margin-top: 10px;
            padding: 7px 12px;
            border: none;
            border-radius: 3px;
            background: #0c66e4;
            color: white;
            cursor: pointer;
            font-weight: 500;
        }

        .add-row:hover {
            background: #0055cc;
        }

        .footer {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total {
            font-weight: 600;
            font-size: 15px;
        }

        .status {
            color: #5e6c84;
            font-size: 12px;
        }

        .empty {
            text-align: center;
            padding: 20px;
            color: #6b778c;
        }
    </style>
</head>

<body>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <script src="table.js"></script>

    <div class="table-wrapper">

        <table>

            <thead>
                <tr>
                    <th class="check">✓</th>
                    <th class="quantity">Quantity</th>
                    <th>Description</th>
                    <th class="cost">Cost</th>
                    <th class="file">File Name</th>
                    <th style="width:35px;"></th>
                </tr>
            </thead>

            <tbody id="tableBody"></tbody>

        </table>

    </div>

    <button class="add-row" id="addRow">
        + Add Row
    </button>

    <div class="footer">
        <div class="total" id="total">
            Total: $0.00
        </div>

        <div class="status" id="status">
            Saved
        </div>
    </div>

</body>

</html>
