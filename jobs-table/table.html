<!DOCTYPE html>

<html>

<head>

    <meta charset="utf-8">

    <title>Items</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;

            height: 100%;

        }


        body {

            padding: 20px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            font-size: 14px;

            background: #ffffff;

            color: #172b4d;

            overflow: hidden;

        }


        .page {

            width: 100%;

            height: 100%;

            display: flex;

            flex-direction: column;

        }


        .top-bar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 12px;

            flex-shrink: 0;

        }


        .title {

            font-size: 18px;

            font-weight: 600;

        }


        .status {

            color: #5e6c84;

            font-size: 12px;

        }


        .table-wrapper {

            flex: 1;

            min-height: 0;

            width: 100%;

            overflow: auto;

            border: 1px solid #dfe1e6;

        }


        table {

            width: max-content;

            min-width: 100%;

            border-collapse: collapse;

            table-layout: fixed;

        }


        th {

            background: #f4f5f7;

            font-weight: 600;

            text-align: left;

            padding: 8px;

            border: 1px solid #dfe1e6;

            white-space: nowrap;

        }


        td {

            padding: 4px;

            border: 1px solid #dfe1e6;

            vertical-align: top;

        }


        th.check,
        td.check {

            width: 42px;

            text-align: center;

            vertical-align: middle;

        }


        th.quantity,
        td.quantity {

            width: 90px;

        }


        th.product,
        td.product {

            width: 180px;

        }


        th.options,
        td.options {

            width: 420px;

        }


        th.cost,
        td.cost {

            width: 100px;

        }


        th.file,
        td.file {

            width: 160px;

        }


        th.delete,
        td.delete {

            width: 40px;

            text-align: center;

        }


        input,
        select {

            width: 100%;

            border: none;

            outline: none;

            padding: 6px;

            background: transparent;

            color: inherit;

            font: inherit;

        }


        input:focus,
        select:focus {

            background: #ffffff;

            box-shadow:
                inset 0 0 0 2px #0c66e4;

            border-radius: 3px;

        }


        input[type="checkbox"] {

            width: 16px;

            height: 16px;

            cursor: pointer;

        }


        select {

            cursor: pointer;

        }


        .options-container {

            display: flex;

            flex-direction: column;

            gap: 7px;

            padding: 3px;

        }


        .option-row {

            display: flex;

            align-items: center;

            gap: 8px;

        }


        .option-label {

            width: 125px;

            flex-shrink: 0;

            color: #5e6c84;

            font-size: 12px;

        }


        .option-control {

            flex: 1;

            min-width: 140px;

        }


        .option-checkbox {

            display: flex;

            align-items: center;

            gap: 7px;

        }


        .option-checkbox input {

            width: 16px;

            flex-shrink: 0;

        }


        .deprecated {

            color: #b76e00;

            font-style: italic;

        }


        .empty {

            text-align: center;

            padding: 20px;

            color: #6b778c;

        }


        .add-row {

            margin-top: 10px;

            padding: 8px 14px;

            border: none;

            border-radius: 3px;

            background: #0c66e4;

            color: white;

            cursor: pointer;

            font-weight: 500;

            align-self: flex-start;

        }


        .add-row:hover {

            background: #0055cc;

        }


        .bottom-bar {

            display: flex;

            justify-content: space-between;

            align-items: flex-end;

            padding-top: 12px;

            flex-shrink: 0;

        }


        .footer-status {

            color: #5e6c84;

            font-size: 12px;

        }


        .bottom-actions {

            display: flex;

            align-items: flex-end;

            gap: 20px;

        }


        .totals {

            width: 280px;

            display: flex;

            flex-direction: column;

            gap: 6px;

        }


        .total-row {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 4px 0;

        }


        .total-row span {

            color: #5e6c84;

        }


        .total-row strong {

            font-weight: 600;

        }


        .total-final {

            margin-top: 4px;

            padding-top: 10px;

            border-top: 2px solid #dfe1e6;

            font-size: 18px;

        }


        .total-final span {

            color: #172b4d;

            font-weight: 600;

        }


        .print-button {

            padding: 8px 14px;

            border: none;

            border-radius: 3px;

            background: #172b4d;

            color: white;

            cursor: pointer;

            font-weight: 500;

            white-space: nowrap;

        }


        .print-button:hover {

            background: #091e42;

        }

    </style>

</head>


<body>


    <div class="page">


        <div class="top-bar">

            <div class="title">
                Task Table
            </div>

            <div
                id="status"
                class="status">

                Loading...

            </div>

        </div>


        <div class="table-wrapper">


            <table>


                <thead>

                    <tr>

                        <th class="check">
                            ✓
                        </th>

                        <th class="quantity">
                            Quantity
                        </th>

                        <th class="product">
                            Product
                        </th>

                        <th class="options">
                            Options
                        </th>

                        <th class="cost">
                            Cost
                        </th>

                        <th class="file">
                            File Name
                        </th>

                        <th class="delete">
                        </th>

                    </tr>

                </thead>


                <tbody id="tableBody">
                </tbody>


            </table>


        </div>


        <button
            class="add-row"
            id="addRow">

            + Add Row

        </button>


        <div class="bottom-bar">


            <div
                id="footerStatus"
                class="footer-status">
            </div>


            <div class="bottom-actions">


                <div class="totals">


                    <div class="total-row">

                        <span>
                            Price
                        </span>

                        <strong id="price">
                            $0.00
                        </strong>

                    </div>


                    <div class="total-row">

                        <span>
                            SubTotal
                        </span>

                        <strong id="subtotal">
                            $0.00
                        </strong>

                    </div>


                    <div class="total-row">

                        <span id="ivuLabel">
                            IVU (11.50%)
                        </span>

                        <strong id="ivu">
                            $0.00
                        </strong>

                    </div>


                    <div class="total-row total-final">

                        <span>
                            Total
                        </span>

                        <strong id="total">
                            $0.00
                        </strong>

                    </div>


                </div>


                <button
                    id="printJob"
                    class="print-button">

                    🖨️ Print Job

                </button>


            </div>


        </div>


    </div>


    <script src="https://p.trellocdn.com/power-up.min.js"></script>

    <script src="table.js"></script>


</body>

</html>
