<!DOCTYPE html>

<html>

<head>

    <meta charset="utf-8">

    <title>Job Order</title>

    <link
        rel="stylesheet"
        href="print.css">

</head>


<body>


    <div class="print-page">


        <!-- HEADER -->

        <header class="header">


            <div class="header-left">


                <div class="header-brand-row">


                    <!-- LOGO -->

                    <div class="logo-container">

                        <img
                            src="Impress_Logo_-_Impress_Corp.webp"
                            class="company-logo">

                    </div>


                    <!-- CONTACT INFORMATION -->

                    <div class="shop-contact">


                        <div class="contact-row">

                            <span class="contact-label">
                                TEL:
                            </span>

                            <span>
                                787-291-4054
                            </span>


                            <span class="whatsapp-contact">

                                <span class="whatsapp-icon">
                                    ☎
                                </span>

                                <span>
                                    939-489-7806
                                </span>

                            </span>

                        </div>


                        <div class="contact-row">

                            <span class="contact-label">
                                EMAIL:
                            </span>

                            <span>
                                ImpressIsabela@gmail.com
                            </span>

                        </div>


                        <div class="contact-row">

                            <span>
                                2960 Ave. Militar Isabela, PR
                            </span>

                        </div>


                    </div>


                </div>


                <!-- DOCUMENT TITLE -->

                <div class="document-title">

                    JOB ORDER

                </div>


            </div>


            <!-- JOB INFORMATION -->

            <div class="job-info">


                <div class="job-number">

                    JOB

                    <strong id="jobId">
                        —
                    </strong>

                </div>


                <div
                    id="date"
                    class="date">

                    —

                </div>


            </div>


        </header>


        <!-- CUSTOMER / CARD -->

        <section class="info-card">


            <div class="info-item">

                <span class="label">
                    Card
                </span>

                <strong id="cardName">
                    —
                </strong>

            </div>


            <div class="info-item">

                <span class="label">
                    Items
                </span>

                <strong id="itemCount">
                    0
                </strong>

            </div>


        </section>


        <!-- PRODUCTS -->

        <main id="items">

            <!-- Generated by print.js -->

        </main>


        <!-- TOTALS -->

        <section class="summary">


            <div class="summary-title">
                ORDER SUMMARY
            </div>


            <div class="summary-row">

                <span>
                    Price
                </span>

                <strong id="price">
                    $0.00
                </strong>

            </div>


            <div class="summary-row">

                <span>
                    SubTotal
                </span>

                <strong id="subtotal">
                    $0.00
                </strong>

            </div>


            <div class="summary-row">

                <span id="ivuLabel">
                    IVU (11.50%)
                </span>

                <strong id="ivu">
                    $0.00
                </strong>

            </div>


            <div class="summary-total">

                <span>
                    TOTAL
                </span>

                <strong id="total">
                    $0.00
                </strong>

            </div>


        </section>


        <!-- FOOTER -->

        <footer class="footer">


            <div>
                Generated from Trello
            </div>


            <div>

                <span id="finishedCount">
                    0
                </span>

                of

                <span id="footerItemCount">
                    0
                </span>

                items finished

            </div>


        </footer>


    </div>


    <div class="print-controls">


        <button id="printButton">

            🖨️ Print / Save PDF

        </button>


    </div>


    <script src="https://p.trellocdn.com/power-up.min.js"></script>

    <script src="print.js"></script>


</body>

</html>
