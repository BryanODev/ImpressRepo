<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>00 - Quick Access</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body class="card-view">
  <main id="app" class="card-app">
    <header class="card-header">
      <div>
        <div class="eyebrow">IMPRESS • SHORTCUTS</div>
        <div class="card-headline">
          <h1>Quick actions</h1><span class="count" id="actionCount"></span>
        </div>
        <p>One click to keep work moving.</p>
      </div><button class="link-button" id="editButton" type="button" title="Edit shortcuts">⚙
        <span>Settings</span></button>
    </header>
    <div class="message" id="message" hidden role="status" aria-live="polite"></div>
    <div class="auth-notice" id="authNotice" hidden><span>Connect Trello to use your shortcuts.</span><button
        type="button" class="small-primary" id="connectButton">Connect Trello</button></div>
    <div class="button-grid" id="buttons">
      <div class="placeholder">Loading shortcuts…</div>
    </div>
    <div class="empty" id="empty" hidden><span class="empty-icon">✦</span><strong>No shortcuts yet</strong>
      <p>Open Settings to create your first shortcut.</p>
    </div>
    <div class="confirm-box" id="confirmBox" hidden>
      <div class="confirm-card">
        <h2 id="confirmTitle">Confirm action</h2>
        <p id="confirmText"></p>
        <div class="confirm-actions"><button class="neutral" type="button" id="cancelConfirm">Cancel</button><button
            class="danger" type="button" id="acceptConfirm">Confirm</button></div>
      </div>
    </div>
  </main>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="./config.js"></script>
  <script src="./common.js"></script>
  <script src="./card.js"></script>
</body>

</html>
