<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Authorize Job Creator</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body class="auth-view">
  <main class="auth-content">
    <p class="muted" id="auth-status">Connecting to Trello…</p>
  </main>
  <script src="./common.js"></script>
  <script>
    (async () => {
      const t = JobCreator.connect();
      JobCreator.initTheme(t);
      try {
        await t.getRestApi().authorize({ scope: 'read,write', expiration: 'never' });
        document.getElementById('auth-status').textContent = 'Connected! Click Create Job again.';
        await t.closePopup();
      } catch (error) {
        console.error(error);
        document.getElementById('auth-status').textContent = 'Could not authorize Trello. Close this window and retry.';
      }
    })();
  </script>
</body>
</html>
